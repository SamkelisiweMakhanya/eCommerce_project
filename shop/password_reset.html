{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SAMKY TECH SHOP</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>

<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">
            <h1>SAMKY TECH SHOP</h1>
            <p>Reset your password</p>
        </div>

        <p>
            Enter the email address associated with your account.
            If an account exists, we will email you a password-reset link.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="login-button"
            >
                Send reset link
            </button>
        </form>

        <p>
            <a href="{% url 'login' %}">
                Back to login
            </a>
        </p>

    </div>
</div>

</body>
</html>
