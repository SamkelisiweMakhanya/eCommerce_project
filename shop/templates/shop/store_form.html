<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }} - SAMKY TECH SHOP</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<main>
    <section>
        <h1>{{ title }}</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Store
            </button>

            <a href="{% url 'vendor_dashboard' %}">
                Cancel
            </a>
        </form>
    </section>
</main>

</body>
</html>
