<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SAMKY TECH SHOP</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: #f5f7fb;
            color: #111827;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        /* Main Container */

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        /* Login Card */

        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);

            border-top: 5px solid #2563eb;
        }

        /* Store Logo / Header */

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #2563eb;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 28px;

            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.25);
        }

        .logo h1 {
            font-size: 28px;
            color: #111827;

            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Messages */

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;

            border-radius: 8px;

            margin-bottom: 10px;

            font-size: 14px;

            background: #dbeafe;
            color: #1e3a8a;

            border-left: 4px solid #2563eb;
        }

        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;

            color: #111827;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;

            padding: 13px 45px 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;

            color: #111827;
            background: #ffffff;

            outline: none;

            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper input::placeholder {
            color: #9ca3af;
        }

        .input-wrapper input:focus {
            border-color: #2563eb;

            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Password Button */

        .password-toggle {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: none;

            cursor: pointer;

            font-size: 18px;

            color: #6b7280;

            transition: 0.2s ease;
        }

        .password-toggle:hover {
            color: #2563eb;
        }

        /* Remember / Forgot */

        .form-options {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #6b7280;

            cursor: pointer;
        }

        .remember input {
            width: 15px;
            height: 15px;

            cursor: pointer;

            accent-color: #2563eb;
        }

        .forgot-password {
            color: #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .forgot-password:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* Login Button */

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.3s ease;
        }

        .login-button:hover {
            background: #1d4ed8;

            transform: translateY(-2px);

            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.20);
        }

        .login-button:active {
            transform: scale(0.99);
        }

        .login-button.loading {
            opacity: 0.7;
            cursor: wait;

            transform: none;
            box-shadow: none;
        }

        /* Register */

        .register-section {
            text-align: center;

            margin-top: 25px;
            padding-top: 25px;

            border-top: 1px solid #e5e7eb;

            color: #6b7280;

            font-size: 14px;
        }

        .register-link {
            color: #2563eb;

            font-weight: 700;

            text-decoration: none;
        }

        .register-link:hover {
            color: #1d4ed8;

            text-decoration: underline;
        }

        /* Back to Store */

        .back-store {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        .back-store:hover {
            color: #2563eb;

            text-decoration: underline;
        }

        /* Footer */

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #9ca3af;

            font-size: 12px;
        }

        /* Error Styling */

        .field-error {
            color: #dc2626;

            font-size: 13px;

            margin-top: 6px;
        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 20px 15px;
            }

            .login-card {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 24px;
            }

            .form-options {
                flex-direction: column;

                align-items: flex-start;

                gap: 12px;
            }
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- Logo / Store Name -->

        <div class="logo">

            <div class="logo-icon">
                🛒
            </div>

            <h1>SAMKY TECH SHOP</h1>

            <p>
                Sign in to your account
            </p>

        </div>


        <!-- Django Messages -->

        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}

            {% if next %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >

            {% endif %}


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <!-- Remember / Forgot -->

            <div class="form-options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>


                <a
                    href="#"
                    class="forgot-password"
                >
                    Forgot password?
                </a>

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <!-- Register -->

        <div class="register-section">

            <p>

                Don't have an account?

                <a
                    href="{% url 'register' %}"
                    class="register-link"
                >
                    Create an account
                </a>

            </p>

        </div>


        <!-- Back to Store -->

        <a
            href="{% url 'product_list' %}"
            class="back-store"
        >
            ← Back to Store
        </a>

    </div>


    <!-- Footer -->

    <div class="footer">

        © 2026 SAMKY TECH SHOP. All rights reserved.

    </div>

</div>


<script>

    /* Show / Hide Password */

    const passwordInput = document.getElementById("password");

    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            togglePassword.textContent = "🙈";

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            passwordInput.type = "password";

            togglePassword.textContent = "👁";

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    });


    /* Login Button Loading State */

    const loginForm = document.querySelector("form");

    const loginButton = document.getElementById("loginButton");

    loginForm.addEventListener("submit", function () {

        loginButton.classList.add("loading");

        loginButton.textContent = "Signing in...";

    });

</script>

</body>

</html>
