<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    {% if form.errors %}
        <p>
            Your username or password is incorrect.
            Please try again.
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        <a href="{% url 'password_reset' %}">
            Forgot your password?
        </a>
    </p>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</body>
</html>
