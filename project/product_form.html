{% extends "shop/base.html" %}

{% block content %}

<h1>Add Product</h1>

<p>Store: {{ store.name }}</p>

<form method="POST">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Add Product
    </button>
</form>

<a href="{% url 'store_detail' store.id %}">
    Cancel
</a>

{% endblock %}
