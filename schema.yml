openapi: 3.0.3
info:
  title: E-Commerce API
  version: 1.0.0
  description: API documentation for the e-commerce project.
paths:
  /api/login/:
    post:
      operationId: login_create
      description: |-
        Authenticate a user using the supplied username and password.

        Args:
            request: The HTTP request containing login credentials.

        Returns:
            A response containing the authentication token and user
            information, or an error response for invalid credentials.
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      description: Return the authenticated buyer's orders.
      tags:
      - orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{order_id}/:
    get:
      operationId: orders_retrieve
      description: Return details for a single order belonging to the buyer.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{order_id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: |-
        Cancel the specified pending order.

        Args:
            request: The HTTP request from the authenticated buyer.
            order_id: The database ID of the order to cancel.

        Returns:
            A response containing the cancelled order or an error message.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{order_id}/pay/:
    post:
      operationId: orders_pay_create
      description: Mark a pending order as paid atomically.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - orders
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/create/:
    post:
      operationId: orders_create_create
      description: |-
        Create an order from the submitted products and quantities.

        Args:
            request: The HTTP request containing order data.

        Returns:
            A response containing the created order or an error message.
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOrder'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOrder'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      description: |-
        Register a new user through the REST API.

        Args:
            request: Django REST Framework request containing
                registration data.

        Returns:
            HTTP 201 with user information when registration succeeds,
            or HTTP 400 with validation errors when it fails.
      tags:
      - register
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/stores/:
    get:
      operationId: stores_list
      description: List existing stores and allow vendors to create new stores.
      tags:
      - stores
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
          description: ''
    post:
      operationId: stores_create
      description: List existing stores and allow vendors to create new stores.
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Store'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Store'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Store'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
          description: ''
  /api/stores/{store_id}/products/:
    get:
      operationId: stores_products_list
      description: List products for a store and allow its vendor to add products.
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - stores
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
          description: ''
    post:
      operationId: stores_products_create
      description: List products for a store and allow its vendor to add products.
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
  /api/stores/{store_id}/reviews/:
    get:
      operationId: stores_reviews_list
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - stores
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
          description: ''
    post:
      operationId: stores_reviews_create
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Review'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/vendor/orders/:
    get:
      operationId: vendor_orders_list
      description: Return orders containing the authenticated vendor's products.
      tags:
      - vendor
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/vendor/orders/{order_id}/:
    get:
      operationId: vendor_orders_retrieve
      description: Return details of an order associated with the authenticated vendor.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - vendor
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/vendor/orders/{order_id}/status/:
    patch:
      operationId: vendor_orders_status_partial_update
      description: Allow vendors to update order status safely.
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - vendor
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVendorOrderStatus'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVendorOrderStatus'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVendorOrderStatus'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/vendors/{vendor_id}/stores/:
    get:
      operationId: vendors_stores_list
      description: List all stores belonging to a specified vendor.
      parameters:
      - in: path
        name: vendor_id
        schema:
          type: integer
        required: true
      tags:
      - vendors
      security:
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
          description: ''
components:
  schemas:
    CreateOrder:
      type: object
      description: Validate the list of items submitted when creating an order.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItem'
      required:
      - items
    CreateOrderItem:
      type: object
      description: Validate product and quantity data for a new order item.
      properties:
        product:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
      required:
      - product
      - quantity
    Login:
      type: object
      description: Validate username and password data for API authentication.
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Order:
      type: object
      description: Serialize order information and its associated order items.
      properties:
        id:
          type: integer
          readOnly: true
        buyer:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/OrderStatusEnum'
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - buyer
      - created_at
      - id
      - items
      - status
      - total
    OrderItem:
      type: object
      description: Serialize individual order items with product and store details.
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        store_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - id
      - price
      - product
      - product_name
      - quantity
      - store_name
    OrderStatusEnum:
      enum:
      - PENDING
      - PAID
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `PAID` - Paid
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    PatchedVendorOrderStatus:
      type: object
      description: Validate order status updates submitted by vendors.
      properties:
        status:
          $ref: '#/components/schemas/VendorOrderStatusStatusEnum'
    Product:
      type: object
      description: Serialize product information for API requests and responses.
      properties:
        id:
          type: integer
          readOnly: true
        store:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        stock:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        image:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - name
      - price
      - store
    Review:
      type: object
      description: Serialize product reviews with buyer and product information.
      properties:
        id:
          type: integer
          readOnly: true
        buyer:
          type: integer
          readOnly: true
        buyer_username:
          type: string
          readOnly: true
        product:
          type: integer
        product_name:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
        comment:
          type: string
        verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - buyer
      - buyer_username
      - comment
      - created_at
      - id
      - product
      - product_name
      - rating
      - verified
    Store:
      type: object
      description: Serialize store information and its associated products.
      properties:
        id:
          type: integer
          readOnly: true
        vendor:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          readOnly: true
      required:
      - created_at
      - description
      - id
      - name
      - products
      - updated_at
      - vendor
    VendorOrderStatusStatusEnum:
      enum:
      - PAID
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PAID` - PAID
        * `COMPLETED` - COMPLETED
        * `CANCELLED` - CANCELLED
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
